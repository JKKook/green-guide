name: waste_app
description: "GreenGuide AI - Waste Classification"
publish_to: 'none'
version: 1.0.0-beta.1+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 갤러리 이미지 선택
  image_picker: ^1.1.2

  # 실시간 카메라 (스마트 캡처)
  camera: ^0.11.0+2

  # 디바이스 안정도 측정 (가속도 센서)
  sensors_plus: ^6.1.0

  # 지역 자동 감지 (지자체별 배출 기준 매핑) — GPS + 역지오코딩
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # 이미지 전처리 (resize, normalize 등 Dart 단에서 처리)
  image: ^4.3.0

  # waste-api HTTP 호출
  http: ^1.2.2

  # 설정 영구 저장 (API URL, 첫 실행 플래그)
  shared_preferences: ^2.3.2

  # 분류 히스토리 로컬 저장
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4

  # 앱 정보 (버전·빌드 번호)
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  sqflite_common_ffi: 2.3.6  # 3.x sqlite3 의 native-asset 훅이 flutter test 에서 멈춤 — 2.x 고정
  path_provider_platform_interface: ^2.1.3
  sqlite3: ^2.9.4
  plugin_platform_interface: ^2.1.8

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  # 파스텔 스카이 그라디언트 배경 (2026-08 아이콘 리뉴얼 — 원본 assets/icon/icon.svg)
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter_native_splash:
  color: "#5980A6"
  image: "assets/splash/logo.png"
  android_12:
    color: "#5980A6"
    # Android 12+ 스플래시는 중앙 원형(약 2/3)만 보이므로 축소한 마크 사용
    image: "assets/splash/logo_android12.png"
  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
    - assets/banners/
    - assets/licenses/
  fonts:
    # 본문 기본 폰트 — 시안(Claude Design) 확정: Pretendard (OFL)
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
    # 유한킴벌리 푸른숲체 (YK Green Forest) — woff2 원본에서 OTF 변환.
    # Medium 을 w400 으로 매핑해 fontWeight.normal 이 Medium 을 쓴다.
    - family: PureunSup
      fonts:
        - asset: assets/fonts/PureunSup-Light.otf
          weight: 300
        - asset: assets/fonts/PureunSup-Medium.otf
          weight: 400
        - asset: assets/fonts/PureunSup-Bold.otf
          weight: 700
